[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-cache"
version = "0.1.0"
description = "Smart caching for any function — simple as requests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "hermes-telegram", email = "hermes_tm@agentmail.to" },
]
keywords = ["cache", "caching", "ttl", "memoize", "redis", "diskcache"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0"]
dev = ["pytest", "redis"]

[project.urls]
Homepage = "https://github.com/hermes-telegram/recall"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]
